[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lobster-press"
version = "5.0.0"
description = "🦞 LobsterPress — Cognitive Memory System for AI Agents"
readme = "README_EN.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SonicBotMan" },
]
keywords = [
    "openclaw", "plugin", "memory", "llm", "context-management",
    "cognitive", "dag-compression", "ebbinghaus", "forgetting-curve",
    "vector-search", "rrf", "mmr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tiktoken>=0.12.0",
    "numpy>=1.21.0,<3",
]

[project.optional-dependencies]
nli = ["sentence-transformers>=2.2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.3.0",
    "black>=23.0.0",
    "isort>=8.0.1",
    "flake8>=6.0.0",
    "mypy>=1.20.2",
    "types-requests>=2.28.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/SonicBotMan/lobster-press"
Repository = "https://github.com/SonicBotMan/lobster-press.git"
Issues = "https://github.com/SonicBotMan/lobster-press/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-fail-under=60"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
